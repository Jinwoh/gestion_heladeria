{% extends "base.html" %}{% block title %}{{ titulo }}{% endblock %}
{% block content %}<section class="card" style="max-width:850px;margin:auto"><h1>{{ titulo }}</h1><form method="post" style="margin-top:18px">{% csrf_token %}{{ form.non_field_errors }}<div class="form-grid">{% for field in form %}<div class="field {% if field.name == 'observaciones' %}span-2{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="row" style="margin-top:18px"><button class="btn primary">Guardar proveedor</button><a class="btn" href="{% url 'inventario:proveedores' %}">Cancelar</a></div></form></section>{% endblock %}
